<section id="top" class="relative isolate flex min-h-[calc(100svh-67px)] flex-col overflow-hidden">
  <div aria-hidden="true" class="absolute inset-x-0 bottom-0 -z-10 h-3/5">
    <!-- Same 768px breakpoint as the terrain's own "small screen" check. -->
    <app-terrain-canvas class="hidden size-full md:block" />
    <app-perspective-grid class="md:hidden" />
    <div class="absolute inset-0 bg-linear-to-b from-bg from-0% to-transparent to-45%"></div>
  </div>

  <div class="flex flex-1 flex-col items-center justify-center gap-6 px-[clamp(1.25rem,5vw,3.5rem)] pt-[clamp(3rem,8vw,5.5rem)] pb-10 text-center">
    <p class="inline-flex items-center gap-2.5 rounded-full bg-line-2 py-1.5 pr-3.5 pl-3 font-mono text-xs text-fg-2">
      <span class="status-dot size-[7px] rounded-full bg-[#3fbf73]" aria-hidden="true"></span>{{ dict().hero.status }}
    </p>

    <h1 class="m-0 text-[clamp(3rem,9.4vw,6.5rem)] leading-[0.95] font-bold tracking-[-0.045em] text-balance">
      {{ profile.name }}
    </h1>

    <p class="m-0 max-w-160 text-[clamp(1.125rem,2.2vw,1.375rem)] leading-[1.45] text-balance text-fg-2">
      {{ dict().hero.tagline }}
    </p>

    <div class="mt-1.5 flex flex-wrap items-center justify-center gap-3">
      <a
        [routerLink]="['/', lang()]"
        fragment="work"
        class="btn rounded-full bg-accent px-6.5 py-3.5 text-base font-semibold text-accent-ink hover:brightness-110"
        >{{ dict().hero.viewWork }}</a
      >
      <div class="flex items-center rounded-full border border-line bg-hdr pr-1.5 text-base font-medium md:backdrop-blur-sm">
        <!-- The label downloads the CV in the language of the current page; the pills pick either one. -->
        <a [href]="profile.cv[lang()]" download class="btn py-3 pr-3 pl-5.5">{{ dict().hero.downloadCv }}</a>
        @for (l of langs; track l) {
          <a
            [href]="profile.cv[l]"
            download
            [attr.lang]="l"
            [attr.aria-label]="dict().a11y.downloadCv + ' ' + l.toUpperCase()"
            class="rounded-full px-2.25 py-1.25 font-mono text-xs font-medium uppercase"
            [class.bg-line-2]="l === lang()"
            [class.text-mute]="l !== lang()"
            >{{ l }}</a
          >
        }
      </div>
    </div>

    <!-- Solid pills so the links stay readable over the animated background. -->
    <p class="m-0 flex flex-wrap items-center justify-center gap-x-3 gap-y-2.5 font-mono text-xs">
      <a
        [href]="profile.links.github.href"
        rel="noopener"
        target="_blank"
        class="rounded-full border border-line bg-hdr px-3.5 py-2 text-fg-2 md:backdrop-blur-sm hover:border-accent hover:text-fg"
        >GitHub ↗</a
      >
      <a
        [href]="profile.links.linkedin.href"
        rel="noopener"
        target="_blank"
        class="rounded-full border border-line bg-hdr px-3.5 py-2 text-fg-2 md:backdrop-blur-sm hover:border-accent hover:text-fg"
        >LinkedIn ↗</a
      >
      <span class="pl-1 text-fg-2">{{ dict().hero.location }}</span>
    </p>
  </div>

  <!-- Last row of the first screen, over the terrain. -->
  <ul
    [attr.aria-label]="dict().a11y.stack"
    class="page-x m-0 flex list-none flex-wrap justify-center gap-x-8 gap-y-3 border-y border-line-2 bg-hdr py-[18px] font-mono text-[13px] text-mute md:backdrop-blur-sm"
  >
    @for (tech of profile.stack; track tech) {
      <li>{{ tech }}</li>
    }
  </ul>
</section>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>404 — Page not found · Soufiane Aloui El Idrissi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script>
    // Same saved theme as the app (see src/index.html).
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <!-- Served by Vercel with a 404 status for any path that has no file. Self-contained: no app bundle. -->
  <style>
    :root { --bg: #0f0d0b; --fg: #f2ede6; --fg-2: #c9c0b4; --mute: #a69d92; --line: rgb(242 237 230 / 0.13); --accent: oklch(0.82 0.15 75); --accent-ink: #1a1205; }
    :root[data-theme='light'] { --bg: #f7f4ef; --fg: #18140f; --fg-2: #463e34; --mute: #6a6156; --line: rgb(30 22 12 / 0.15); --accent: oklch(0.56 0.13 62); --accent-ink: #fffaf2; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, sans-serif; text-align: center; }
    main { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 560px; }
    .code { font-family: ui-monospace, monospace; font-size: 13px; color: var(--accent); }
    h1 { font-size: clamp(2rem, 7vw, 3.25rem); line-height: 1.05; letter-spacing: -0.04em; }
    p { color: var(--fg-2); line-height: 1.5; }
    .fr { color: var(--mute); }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
    a { padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); font-weight: 600; text-decoration: none; }
    a.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
    a:hover { filter: brightness(1.1); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>This page doesn’t exist or has moved.</p>
    <p class="fr" lang="fr">Cette page n’existe pas ou a été déplacée.</p>
    <nav>
      <a class="primary" href="/en">Back to the portfolio</a>
      <a href="/fr" lang="fr">Retour au portfolio</a>
    </nav>
  </main>
</body>
</html>
